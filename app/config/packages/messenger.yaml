framework:
    messenger:
        # failure_transport deliberately not configured — single-user desktop app, nobody to
        # manually triage `messenger:failed:*` on a schedule.
        transports:
            # Backed by the dedicated `queue` connection (data/queue.db, see doctrine.yaml) —
            # isolated from user data. The messenger_messages table is created explicitly via
            # `bin/console messenger:setup-transports`.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # Worst-case retry window here (3 * up to 4s = ~7s) must stay well under
                # app.sync.push_on_edit_ttl_seconds (config/services.yaml, issue #366) — that TTL
                # is what PushSyncMessageHandler checks before pushing a queued PushSyncMessage,
                # and it exists precisely so an aggressive backoff here can never itself outlive
                # the TTL and get a message dropped mid-retry instead of eventually delivered.
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0

            # Same connection/table as `async` (queue_name is the only difference) — a plugin
            # media download or normalization failure is never an exception here (see
            # HttpPluginMediaDownloader), so this transport's default retry policy exists only
            # for the truly unexpected case (issue #508). The consumer command
            # (native/supervisor/messenger-consumer.js) lists `async` before `media`, which is
            # what actually makes this low priority: a Doctrine transport has no built-in
            # priority of its own, `messenger:consume`'s transport order is.
            media:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: media

            # Symfony Scheduler transport (issue #685): consuming it is what turns
            # App\Scheduler\DownloadsPollSchedule's recurring trigger into a dispatched
            # App\Message\PollDownloadsMessage on every tick. No `dsn` env var here, unlike the
            # two transports above — 'schedule://<name>' resolves to the ScheduleProviderInterface
            # service tagged with that name (#[AsSchedule('downloads_poll')]), not a queue.
            scheduler_downloads_poll: 'schedule://downloads_poll'

            # Symfony Scheduler transport (issue #448), same pattern as scheduler_downloads_poll
            # right above: consuming it turns App\Scheduler\MarketRefreshSchedule's hourly
            # recurring trigger into a dispatched App\Message\MarketRefreshTickMessage on every
            # tick, resolved against the ScheduleProviderInterface service tagged
            # #[AsSchedule('market_refresh')], not a queue.
            scheduler_market_refresh: 'schedule://market_refresh'

            # Background tasks scheduled by plugins via
            # AnimeDb\PluginContracts\Background\BackgroundTaskQueueInterface (issue #701, part 1
            # of 3 for #684). Same connection/table as `async`/`media` (queue_name is the only
            # difference) — consumed by its own long-lived process
            # (native/supervisor/plugins-consumer.js) rather than sharing a worker with the
            # transports above, so a long-running plugin task can never occupy the worker
            # `PushSyncMessage` depends on and get it dropped past its TTL (config/services.yaml,
            # issue #366). Routed message: App\Message\RunPluginBackgroundTaskMessage (issue #702,
            # part 2 of 3 for #684).
            plugins:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: plugins
                    # Not the doctrine default of 3600s: stopping the consumer is routine (app
                    # close, plugin install/update/removal: SIGTERM, then SIGKILL after 500 ms),
                    # and the message it was handling stays "in progress" until this timeout
                    # expires — with the default, an interrupted task would only come back an hour
                    # later. Not lower either: it must stay well above the longest task (a
                    # 50-file season folder at a 15 s probe timeout per file is ~12 minutes),
                    # because a second consumer is a recorded direction and would otherwise pick up
                    # a task the first one is still running.
                    redeliver_timeout: 900

        routing:
            'App\Message\ScanStorageMessage': async
            'App\Message\IndexAnimeMessage': async
            'App\Message\DeleteFromIndexMessage': async
            'App\Message\PushSyncMessage': async
            'App\Message\BackfillExternalIdMessage': async
            'App\Message\SyncSeedMessage': async
            'App\Message\RefreshMarketSnapshotMessage': async
            'App\Message\DownloadAnimeMediaMessage': media
            'App\Message\RunPluginBackgroundTaskMessage': plugins
