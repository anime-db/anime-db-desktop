doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                driver: pdo_sqlite
            # Dedicated connection for the Messenger `async` transport (data/queue.db) — kept
            # separate from the main data.db because queue data is disposable (unlike user data)
            # and a separate SQLite file avoids lock contention between the FrankenPHP HTTP
            # worker and the future consumer process.
            queue:
                url: '%env(resolve:QUEUE_DATABASE_URL)%'
                driver: pdo_sqlite
        types:
            unix_timestamp: App\Doctrine\Type\UnixTimestampType
            rating: App\Doctrine\Type\RatingType
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
