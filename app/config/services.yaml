# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # In production Electron passes MEDIA_DIR (see native/supervisor/frankenphp.js), pointing
    # at %AppData%/media/ — the directory native/protocols/app-media.js serves covers/images
    # from. This default only applies in dev, where there's no Electron process around it.
    app.media_dir.dev_default: '%kernel.project_dir%/public/media'
    app.media_dir: '%env(default:app.media_dir.dev_default:MEDIA_DIR)%'

    # In production Electron passes IMPORT_STAGING_DIR (see native/paths.js,
    # native/supervisor/env.js), pointing at %AppData%/import-staging/ — where
    # App\Service\Import\CatalogStageService (issue #669) unpacks a validated catalog export
    # archive (data.db, media/) plus its import.json marker, ahead of a later, separate import
    # step that actually applies it.
    app.import_staging_dir.dev_default: '%kernel.project_dir%/var/import-staging'
    app.import_staging_dir: '%env(default:app.import_staging_dir.dev_default:IMPORT_STAGING_DIR)%'

    # In production Electron passes IMPORT_REJECTION_PATH (see native/paths.js,
    # native/supervisor/env.js), pointing at %AppData%/import-rejected.json — where
    # native/supervisor/staged-import.js (issue #706) records why the startup decision step
    # rejected a staged import (invalid marker, incompatible schema, or the user declining a
    # staging older than 24 hours). Written outside `app.import_staging_dir` deliberately: a
    # rejection always deletes that directory entirely, and the reason must survive so
    # App\Service\Import\StagedImportService can still show it on /settings/backup afterwards.
    app.import_rejection_path.dev_default: '%kernel.project_dir%/var/import-rejected.json'
    app.import_rejection_path: '%env(default:app.import_rejection_path.dev_default:IMPORT_REJECTION_PATH)%'

    # In production Electron passes IMPORT_APPLIED_PATH (see native/paths.js,
    # native/supervisor/env.js), pointing at %AppData%/import-applied.json — where
    # native/supervisor/import-apply.js best-effort carries the staged archive's manifest.json to
    # after a successful catalog import (issue #726), for
    # App\Service\Import\ImportedPluginsService to read on /settings/backup.
    app.import_applied_path.dev_default: '%kernel.project_dir%/var/import-applied.json'
    app.import_applied_path: '%env(default:app.import_applied_path.dev_default:IMPORT_APPLIED_PATH)%'

    # In production Electron passes CONFIG_PATH (see native/paths.js, native/supervisor/frankenphp.js),
    # pointing at %AppData%/config.json — the same file native/config.js writes appSecret to,
    # and where the user's pagination mode preference (issue #74) lives.
    app.config_path.dev_default: '%kernel.project_dir%/var/config.json'
    app.config_path: '%env(default:app.config_path.dev_default:CONFIG_PATH)%'

    # In production Electron passes PLUGINS_CONFIG_PATH (see native/paths.js,
    # native/supervisor/frankenphp.js, native/supervisor/messenger-consumer.js), pointing at
    # %AppData%/plugins.json — one shared file for every installed plugin's settings/credentials
    # (OAuth refresh tokens, endpoint config, feature flags), read/written by both the HTTP
    # worker and the background messenger consumer (issue #219).
    app.plugins_config_path.dev_default: '%kernel.project_dir%/var/plugins.json'
    app.plugins_config_path: '%env(default:app.plugins_config_path.dev_default:PLUGINS_CONFIG_PATH)%'

    # In production Electron passes PLUGINS_DIR (see native/paths.js, native/supervisor/frankenphp.js),
    # pointing at %AppData%/plugins/ — the directory installed plugins are unpacked into, one
    # subdirectory per PluginId holding that plugin's manifest.json plus the rest of its archive
    # (issue #241). InstalledPluginsRegistry::reconcile() scans it and writes its own
    # installed-plugins.php index next to it.
    app.plugins_dir.dev_default: '%kernel.project_dir%/var/plugins'
    app.plugins_dir: '%env(default:app.plugins_dir.dev_default:PLUGINS_DIR)%'

    # In production Electron passes NATIVE_TRANSLATIONS_DIR (see native/paths.js,
    # native/supervisor/env.js), pointing at native/translations/ — the built-in splash/tray/
    # dialog catalogs (issue #404), shipped next to the Electron main process rather than under
    # AppData. App\Service\Translation\NativeTranslationsOverlayWriter (issue #647) reads its
    # en.json as the reference key set an overlay value is allowed to carry.
    app.native_translations_dir.dev_default: '%kernel.project_dir%/../native/translations'
    app.native_translations_dir: '%env(default:app.native_translations_dir.dev_default:NATIVE_TRANSLATIONS_DIR)%'

    # In production Electron passes NATIVE_TRANSLATIONS_OVERLAY_DIR (see native/paths.js,
    # native/supervisor/env.js), pointing at %AppData%/native-translations/ — the per-locale
    # overlay files App\Service\Translation\NativeTranslationsOverlayWriter (issue #647) writes,
    # merged over the built-in native catalog by native/i18n at read time (issue #646).
    app.native_translations_overlay_dir.dev_default: '%kernel.project_dir%/var/native-translations'
    app.native_translations_overlay_dir: '%env(default:app.native_translations_overlay_dir.dev_default:NATIVE_TRANSLATIONS_OVERLAY_DIR)%'

    # The app's own version (issue #565) — package.json's "version", the same value Electron's
    # app.getVersion() reads and, in production, passes down as CORE_VERSION (see
    # native/supervisor/frankenphp.js, native/supervisor/messenger-consumer.js). Used by the
    # plugin ZIP installer's compat check (issue #249) to enforce manifest.require.core.
    # Deliberately NOT declared here as an %env(default:...)%: outside of Electron (dev run,
    # bin/console, unit tests) CORE_VERSION is never set, and a literal default would just be
    # another independent copy of the version to keep in sync. Set from
    # App\Service\Version\AppVersionResolver in Kernel::build() instead, via
    # $container->setParameter() — same reasoning as app.plugin_contracts_version right below,
    # including why it must not be redeclared here.

    # The installed `anime-db/plugin-contracts` version (issue #561) — like app.core_version
    # above, not sourced from an env var Electron passes in: there is no equivalent value for it,
    # since this is a fact about the app's own vendor/composer/installed.php lock, not deployment
    # configuration. Set from Composer\InstalledVersions::getPrettyVersion() in Kernel::build()
    # instead, via $container->setParameter() — deliberately NOT redeclared here. Kernel::build()
    # runs before this file is loaded (registerContainerConfiguration()), so a declaration here,
    # even `~`, would load after build() and silently overwrite the real value with null (PR #563
    # review). This comment documents the parameter's existence and intent for readers of this
    # file; the binding below is what actually resolves it. Used by ZipPluginInstaller's
    # install-time compat gate and InstalledPluginsRegistry's derived per-plugin compatibility to
    # check a manifest's optional `require.plugin-contracts` constraint against what is actually
    # vendored, not against this app's own `composer.json` constraint on it (`^0.15`).

    # Built-in locales, kept as an explicit list rather than scanning app/translations/ on every
    # request (FrankenPHP worker mode keeps consumers alive between requests, so a glob() there
    # would mean disk I/O per request for no benefit). Extend this list when adding a core locale.
    # App\Service\Plugin\AvailableLocalesProvider (issue #453) merges this with locales declared
    # by enabled "translation" plugins, recomputed on every call rather than cached — see its
    # class docblock and .claude-docs/decisions.md (issue #84). LocaleSubscriber,
    # SettingsController and TranslationController all consume AvailableLocalesProvider, not this
    # parameter, directly.
    app.locales: ['en', 'ru']

    # Source cover images for SampleAnimeSeeder (issue #181) — shipped under public/ like
    # css/js/index.php, not under AppData, since they are app assets, not user data.
    app.sample_covers_dir: '%kernel.project_dir%/public/sample'

    # Meilisearch process endpoint (native/supervisor/meilisearch.js) and its master key,
    # both already provisioned in production by Electron (issue #8) — see .env for dev defaults.
    app.meilisearch.url: '%env(MEILISEARCH_URL)%'
    app.meilisearch.key: '%env(MEILISEARCH_KEY)%'

    # qbittorrent-nox sidecar's WebUI endpoint (native/supervisor/qbittorrent.js, issue #345) —
    # the port is pinned, not discovered, but the URL is still passed through env rather than
    # hardcoded here so the port constant has a single source of truth.
    app.qbittorrent.url: '%env(QBITTORRENT_URL)%'

    # Bundled ffprobe executable (native/paths.js → FFPROBE_BIN in native/supervisor/env.js).
    # Never looked up in PATH: only this exact file is ever executed.
    app.ffprobe.bin: '%env(FFPROBE_BIN)%'

    # Push-on-edit TTL (issue #366, PushSyncMessageHandler): how long, since dispatch, a queued
    # PushSyncMessage is still trusted as a same-state optimistic write before the standard
    # reconciliation run is left to reconcile the divergence instead — see .claude-docs/sync.md's
    # "Ритм: push-on-edit". Deliberately generous relative to the `async` transport's own
    # retry_strategy (config/packages/messenger.yaml, see the comment there): a value hardcoded
    # independently of that backoff could end up shorter than its worst-case retry window and
    # drop a message mid-retry instead of letting it eventually succeed.
    app.sync.push_on_edit_ttl_seconds: 300

    # In production Electron passes MARKET_REGISTRY_CACHE_PATH (see native/paths.js,
    # native/supervisor/env.js), pointing at %AppData%/market-registry-cache.json — the
    # last signature-verified plugins-registry.json (issue #292): PluginRegistryLoader falls back
    # to it whenever a fresh download fails a check, and its "sequence" field is what anti-rollback
    # protection compares new downloads against across app restarts.
    app.market_registry_cache_path.dev_default: '%kernel.project_dir%/var/market-registry-cache.json'
    app.market_registry_cache_path: '%env(default:app.market_registry_cache_path.dev_default:MARKET_REGISTRY_CACHE_PATH)%'

    # Same injection pattern as app.market_registry_cache_path above, for MarketSnapshotCache
    # (issue #436): production Electron passes MARKET_SNAPSHOT_CACHE_PATH (native/paths.js,
    # native/supervisor/env.js) pointing at %AppData%/market-snapshot-cache.json. Written by
    # MarketRefreshService::refresh() (issue #438, extracted from MarketRefreshCommand by issue
    # #440), the snapshot's single writer — reached from the console command, the async messenger
    # handler and, on the native side, an app update deleting the file directly (native/supervisor/
    # cache-invalidation.js#invalidateMarketSnapshot).
    app.market_snapshot_cache_path.dev_default: '%kernel.project_dir%/var/market-snapshot-cache.json'
    app.market_snapshot_cache_path: '%env(default:app.market_snapshot_cache_path.dev_default:MARKET_SNAPSHOT_CACHE_PATH)%'

    # Guards MarketRefreshService::refresh() (issue #438, extracted from MarketRefreshCommand by
    # issue #440) against a second, concurrent invocation: refresh() flock()s this file for its
    # duration, so a second call started while one is already running — whether the console
    # command or the async messenger handler — can detect that and no-op instead of racing the
    # first one to write the snapshot. Same injection pattern as the two market cache paths
    # above; kept as its own file (not e.g. the snapshot cache path) so acquiring the lock never
    # has to touch — or risk truncating — the snapshot itself.
    app.market_refresh_lock_path.dev_default: '%kernel.project_dir%/var/market-refresh.lock'
    app.market_refresh_lock_path: '%env(default:app.market_refresh_lock_path.dev_default:MARKET_REFRESH_LOCK_PATH)%'

    # In production Electron passes BACKUPS_DIR (see native/paths.js, native/supervisor/env.js),
    # pointing at %AppData%/backups/ — where native/supervisor/migrations.js writes pre-migration
    # (and, issue #681, pre-import) snapshots of data.db. App\Service\Backup\BackupListService
    # only reads this directory, for the /settings/backup snapshot list; creating, pruning and
    # restoring snapshots all stay native-side.
    app.backups_dir.dev_default: '%kernel.project_dir%/var/backups'
    app.backups_dir: '%env(default:app.backups_dir.dev_default:BACKUPS_DIR)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%kernel.project_dir%'
            $mediaDir: '%app.media_dir%'
            $importStagingDir: '%app.import_staging_dir%'
            $importRejectionPath: '%app.import_rejection_path%'
            $importAppliedPath: '%app.import_applied_path%'
            $backupsDir: '%app.backups_dir%'
            $configPath: '%app.config_path%'
            $pluginsConfigPath: '%app.plugins_config_path%'
            $pluginsDir: '%app.plugins_dir%'
            $nativeTranslationsDir: '%app.native_translations_dir%'
            $nativeTranslationsOverlayDir: '%app.native_translations_overlay_dir%'
            $coreVersion: '%app.core_version%'
            $pluginContractsVersion: '%app.plugin_contracts_version%'
            $coreLocales: '%app.locales%'
            $sampleCoversDir: '%app.sample_covers_dir%'
            $pushOnEditTtlSeconds: '%app.sync.push_on_edit_ttl_seconds%'
            $cachePath: '%app.market_registry_cache_path%'
            $snapshotCachePath: '%app.market_snapshot_cache_path%'
            $refreshLockPath: '%app.market_refresh_lock_path%'

    # AnimeDb\PluginContracts\Filler\FillerInterface/Search\SearchByPluginInterface/
    # Widget\EntryWidgetInterface/Widget\CatalogWidgetInterface/Sync\SyncInterface all live
    # in the read-only anime-db/plugin-contracts package, so they cannot carry
    # #[AutoconfigureTag] themselves the way a local interface does.
    # _instanceof would only tag services declared in *this* file though, and plugin services are
    # declared in each plugin bundle's own DI config, loaded separately on boot (issue #218) — so
    # tagging them (app.filler/app.search_by_plugin/app.entry_widget/app.catalog_widget/app.sync,
    # each with an `id` attribute equal to the plugin's id) is done by
    # App\Service\Plugin\DependencyInjection\Compiler\TagPluginServicesPass instead (issue #278),
    # registered in App\Kernel::build(). Nothing in this file needs those tags today; add an
    # _instanceof entry here if a host-internal service ever implements one of these interfaces.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # SQLite ignores ON DELETE RESTRICT/CASCADE/SET NULL unless "PRAGMA foreign_keys = ON" is
    # set on every new connection (see issue #48, bug B-20). Doctrine DBAL ships a middleware
    # for exactly this; it just needs to be registered for our connection.
    Doctrine\DBAL\Driver\AbstractSQLiteDriver\Middleware\EnableForeignKeys:
        tags:
            - { name: 'doctrine.middleware' }

    # FrameworkBundle only aliases Symfony\Contracts\Translation\TranslatorInterface for
    # autowiring, not TranslatorBagInterface::getCatalogue() (needed by TranslationController,
    # issue #87) — add it explicitly so the interface stays autowireable.
    Symfony\Component\Translation\TranslatorBagInterface: '@translator'

    # The app only ships for Windows (see .claude-docs/architecture.md) — a single
    # ProcessLivenessChecker implementation is all JobLockService (issue #98) needs.
    App\Service\JobLock\ProcessLivenessChecker: '@App\Service\JobLock\WindowsProcessLivenessChecker'

    # disk_free_space() cannot be mocked directly — FreeSpaceChecker (issue #348) depends on this
    # interface instead so it stays unit-testable without touching a real volume.
    App\Service\Download\FreeSpaceProvider: '@App\Service\Download\NativeFreeSpaceProvider'

    # Left to its default PSR-18 client discovery, Meilisearch\Client would inherit whatever
    # timeout that client defaults to — potentially none. The list search box (issue #199)
    # needs a fast, bounded failure when Meilisearch is unreachable so it can fall back to the
    # FTS5 quick-filter (#195) instead of hanging the request.
    app.meilisearch.http_client:
        class: Symfony\Component\HttpClient\Psr18Client
        arguments:
            $client: '@app.meilisearch.symfony_http_client'

    app.meilisearch.symfony_http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            - { timeout: 2, max_duration: 3 }

    # Used by HttpPluginMediaDownloader (issue #231) to fetch a plugin-supplied cover/gallery
    # image URL. A separate client from app.meilisearch.symfony_http_client above: covers/images
    # come from arbitrary external hosts, not a local, always-up Meilisearch process, so this one
    # allows a longer timeout and, unlike the Meilisearch client, is routed through the app's
    # configured outgoing proxy (issue #327) via ProxyAwareHttpClient.
    app.plugin_media.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['App\Service\Http\ProxyAwareHttpClient', 'create']
        arguments:
            - '@App\Service\ProxyConfigProvider'
            - { timeout: 5, max_duration: 15 }

    App\Service\Plugin\Filler\HttpPluginMediaDownloader:
        arguments:
            $httpClient: '@app.plugin_media.http_client'

    App\Service\Plugin\Filler\PluginMediaDownloaderInterface: '@App\Service\Plugin\Filler\HttpPluginMediaDownloader'

    # Used by PluginRegistryFetcher and MarketAssetDownloader (issue #292) to download
    # plugins-registry.json/its signature and plugin.zip archives from the market's mirrors.
    # Routed through the app's configured outgoing proxy (issue #327) like app.plugin_media.http_client
    # above, for the same reason: these are arbitrary external hosts, not a local process. The
    # longer max_duration accommodates a full plugin.zip download, not just a small JSON file.
    app.market.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['App\Service\Http\ProxyAwareHttpClient', 'create']
        arguments:
            - '@App\Service\ProxyConfigProvider'
            - { timeout: 10, max_duration: 60 }

    App\Service\Market\PluginRegistryFetcher:
        arguments:
            $httpClient: '@app.market.http_client'

    App\Service\Market\MarketAssetDownloader:
        arguments:
            $httpClient: '@app.market.http_client'

    # ProxyTestService (issue #328, settings page "Test" button) always tests a form-supplied
    # proxy, never the one ProxyConfigProvider currently has saved — a plain CurlHttpClient, not
    # ProxyAwareHttpClient, so the "proxy" option it sets per-request is never overridden by the
    # saved config. Forced to CurlHttpClient rather than HttpClient::create() for the same reason
    # as app.plugin_media.http_client: SOCKS5 needs ext-curl.
    app.proxy_test.http_client:
        class: Symfony\Component\HttpClient\CurlHttpClient
        arguments:
            - { timeout: 10, max_duration: 10 }

    App\Service\Http\ProxyTestService:
        arguments:
            $httpClient: '@app.proxy_test.http_client'

    # Every installed plugin gets this preconfigured PSR-18 client via DI just by type-hinting
    # Psr\Http\Client\ClientInterface (issue #293 item 4) — see PluginHttpClientFactory for why
    # a factory, not a bare service definition here, is needed: it wraps the transport in
    # ProxyAwareHttpClient (issue #327) so plugin requests go through the app's configured proxy.
    #
    # PSR-17's RequestFactoryInterface/StreamFactoryInterface (needed to *build* a request, e.g.
    # an OAuth token exchange/refresh, issue #309) are NOT bound here: they are already global
    # autowire aliases to Http\Discovery\Psr17Factory in config/packages/http_discovery.yaml,
    # available to plugins the same as any other service. Aliasing them here too would silently
    # override that binding app-wide (this file loads after config/packages/*.yaml), splitting
    # the six PSR-17 interfaces across two different factory instances for no benefit — any
    # PSR-7 message built by Psr17Factory works with Psr18Client::sendRequest() regardless.
    Psr\Http\Client\ClientInterface:
        factory: ['@App\Service\Plugin\Http\PluginHttpClientFactory', 'create']

    # meilisearch/meilisearch-php's Client is not autowireable as-is: its constructor takes
    # plain url/apiKey strings, not services (see AnimeSearchIndexer, issue #196).
    Meilisearch\Client:
        arguments:
            $url: '%app.meilisearch.url%'
            $apiKey: '%app.meilisearch.key%'
            $httpClient: '@app.meilisearch.http_client'

    # The sidecar is on loopback only (issue #345) — no proxy, no auth, just a bounded timeout so
    # a stuck request never hangs the FrankenPHP worker.
    app.qbittorrent.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            - { timeout: 5, max_duration: 15 }

    App\Service\Qbittorrent\QbittorrentClient:
        arguments:
            $httpClient: '@app.qbittorrent.http_client'
            $baseUrl: '%app.qbittorrent.url%'

    # AnimeDb\PluginContracts\Download\DownloadServiceInterface lives in the read-only
    # anime-db/plugin-contracts package, so App\Service\Download\QbittorrentDownloadService
    # cannot self-alias to it the way a local interface would (see the _instanceof comment
    # above) — an explicit alias, the same approach used above for
    # Symfony\Component\Translation\TranslatorBagInterface and
    # App\Service\JobLock\ProcessLivenessChecker, keeps it autowireable by anything (core or
    # plugin) that type-hints the contract interface (issue #346).
    AnimeDb\PluginContracts\Download\DownloadServiceInterface: '@App\Service\Download\QbittorrentDownloadService'

    # Same read-only-package reason as the DownloadServiceInterface alias above.
    AnimeDb\PluginContracts\Media\MediaLibraryInterface: '@App\Service\Media\MediaLibrary'

    App\Service\Media\FfprobeMediaProbe:
        arguments:
            $ffprobeBin: '%app.ffprobe.bin%'

    # Same read-only-package reason as the DownloadServiceInterface alias above.
    AnimeDb\PluginContracts\Media\MediaProbeInterface: '@App\Service\Media\FfprobeMediaProbe'
