<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>AnimeDB</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /*
         * Light/dark values below are Bootstrap 5.3's body-bg/body-color/border-color for each
         * color mode, so the splash matches the first frame of the main window (see
         * native/theme.js's BACKGROUND_COLOR — keep the background values in sync with it by
         * hand). The window's own nativeTheme.themeSource is set before this window is created
         * (see native/lifecycle/index.js), so prefers-color-scheme here reflects the app's own
         * theme preference, not just the OS setting.
         */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #ffffff;
            color: #212529;
            font-family: system-ui, sans-serif;
            user-select: none;
            overflow: hidden;
        }
        .logo {
            width: 220px;
            margin-bottom: 40px;
        }
        .track {
            width: 300px;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .bar {
            height: 100%;
            width: 25%;
            /* Decorative only, no text drawn on top — see app/assets/scss/_palette.scss on why
               $adb-accent (not $adb-accent-strong) is fine here but not as a text background. */
            background: #fc6703;
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .status {
            font-size: 12px;
            color: rgba(33, 37, 41, .75);
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #212529;
                color: #dee2e6;
            }
            .track {
                background: #343a40;
            }
            .status {
                color: rgba(222, 226, 230, .75);
            }
        }
    </style>
</head>
<body>
    <img class="logo" id="logo" alt="AnimeDB">
    <div class="track">
        <div class="bar" id="bar"></div>
    </div>
    <div class="status" id="status"></div>
    <script>
        var bar    = document.getElementById('bar');
        var status = document.getElementById('status');
        var logo   = document.getElementById('logo');

        if (window.splash) {
            document.documentElement.lang = window.splash.locale;
            document.documentElement.dir = window.splash.dir;
            logo.src = window.splash.logoPath;
            status.textContent = window.splash.initialStatus;
            window.splash.onProgress(function (data) {
                var percent = data.total ? Math.round((data.step / data.total) * 100) : 100;
                bar.style.width = percent + '%';
                status.textContent = data.text;
            });
        }
    </script>
</body>
</html>
