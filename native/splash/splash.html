<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>AnimeDB</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #12131a;
            color: #ccc;
            font-family: system-ui, sans-serif;
            user-select: none;
            overflow: hidden;
        }
        .logo {
            width: 220px;
            margin-bottom: 40px;
        }
        .track {
            width: 300px;
            height: 4px;
            background: #2a2a3a;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .bar {
            height: 100%;
            width: 25%;
            background: #6c63ff;
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .status {
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <img class="logo" id="logo" alt="AnimeDB">
    <div class="track">
        <div class="bar" id="bar"></div>
    </div>
    <div class="status" id="status"></div>
    <script>
        var bar    = document.getElementById('bar');
        var status = document.getElementById('status');
        var logo   = document.getElementById('logo');

        if (window.splash) {
            document.documentElement.lang = window.splash.locale;
            logo.src = window.splash.logoPath;
            status.textContent = window.splash.initialStatus;
            window.splash.onProgress(function (data) {
                var percent = data.total ? Math.round((data.step / data.total) * 100) : 100;
                bar.style.width = percent + '%';
                status.textContent = data.text;
            });
        }
    </script>
</body>
</html>
