name: CI

on:
  # FIXME(этап 11 «Релиз»): триггер push в master временно отключён ради экономии
  # минут GitHub Actions в фазе активной разработки — PR всё равно прогоняет тот же
  # код перед мёржем, поэтому повторная валидация уже смёрженного master сейчас
  # избыточна. Вернуть перед релизом (см. roadmap, Этап 11): раскомментировать,
  # чтобы у master снова был собственный зелёный гейт.
  # push:
  #   branches: [master]
  pull_request:

# Отменяем устаревшие прогоны PR при новом пуше (частые автоправки openronin).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Один job на весь PHP-тулинг: composer install один раз, затем phpunit/phpstan/cs
  # подряд. Раньше это были 4 отдельных job — а GitHub тарифицирует каждый job с
  # округлением вверх до 1 минуты, поэтому 4 быстрых job = 4 билл-минуты на пустом
  # месте. Шаги идут через `if: ${{ !cancelled() }}`, чтобы при падении одного всё
  # равно отработали остальные и было видно все ошибки сразу (как в отдельных job).
  php:
    name: PHP
    runs-on: ubuntu-latest
    # Умолчание GitHub — 360 минут: зависший шаг не падает, а молча тарифицируется до
    # потолка. Реальный прогон укладывается в полторы минуты, так что 15 — примерно
    # десятикратный запас: обычная джоба этого лимита не касается, а повисший
    # composer/npm обрывается за минуты вместо часов. Если джоба начнёт упираться в
    # лимит стабильно — это повод разобраться, а не молча поднять число.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
          # intl добавлен ЗАРАНЕЕ, до кода, который им пользуется: подписи в переключателе
          # языка переезжают с ключей перевода на ICU-эндонимы (issue #461, PR #464), а
          # .github/ правит только человек — автоматика сюда не ходит, поэтому джоба
          # готовится отдельным PR перед той правкой, а не вместе с ней.
          #
          # На ubuntu-latest setup-php включает intl по умолчанию, так что сегодня строка
          # ничего не меняет. Она нужна против будущего: если умолчание изменится, тесты,
          # пропускающие себя при отсутствии расширения, уйдут в skip при зелёном прогоне —
          # не упадут, а молча перестанут проверять боевой путь.
          extensions: apcu, gd, intl
          ini-values: apc.enable_cli=1

      - name: Configure Composer auth for private repos
        run: composer config --global github-oauth.github.com ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: app

      # Полный прогон покрывает и консистентность переводов (бывшая отдельная job
      # translations-consistency гоняла подмножество этого же набора — удалена).
      - name: Run PHPUnit
        run: vendor/bin/phpunit
        working-directory: app

      - name: Run PHPStan
        if: ${{ !cancelled() }}
        run: composer phpstan
        working-directory: app

      - name: Check code style
        if: ${{ !cancelled() }}
        run: composer cs-check
        working-directory: app

  # Один job на весь JS-тулинг: npm ci один раз, затем lint + jest (та же логика
  # экономии, что и у PHP-джобы выше).
  js:
    name: JS
    runs-on: ubuntu-latest
    # Тот же потолок, что и у PHP-джобы, и по той же причине. Прогон идёт полминуты,
    # запас здесь ещё больше; значение держим одинаковым с соседней джобой намеренно —
    # это граница «что-то зависло», а не бюджет на выполнение.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest
        if: ${{ !cancelled() }}
        run: npm test
