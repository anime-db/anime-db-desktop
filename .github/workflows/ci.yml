name: CI

on:
  # FIXME(этап 11 «Релиз»): триггер push в master временно отключён ради экономии
  # минут GitHub Actions в фазе активной разработки — PR всё равно прогоняет тот же
  # код перед мёржем, поэтому повторная валидация уже смёрженного master сейчас
  # избыточна. Вернуть перед релизом (см. roadmap, Этап 11): раскомментировать,
  # чтобы у master снова был собственный зелёный гейт.
  # push:
  #   branches: [master]
  pull_request:

# Отменяем устаревшие прогоны PR при новом пуше (частые автоправки openronin).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Один job на весь PHP-тулинг: composer install один раз, затем phpunit/phpstan/cs
  # подряд. Раньше это были 4 отдельных job — а GitHub тарифицирует каждый job с
  # округлением вверх до 1 минуты, поэтому 4 быстрых job = 4 билл-минуты на пустом
  # месте. Шаги идут через `if: ${{ !cancelled() }}`, чтобы при падении одного всё
  # равно отработали остальные и было видно все ошибки сразу (как в отдельных job).
  php:
    name: PHP
    runs-on: ubuntu-latest
    # Умолчание GitHub — 360 минут: зависший шаг не падает, а молча тарифицируется до
    # потолка. Реальный прогон укладывается в полторы минуты, так что 15 — примерно
    # десятикратный запас: обычная джоба этого лимита не касается, а повисший
    # composer/npm обрывается за минуты вместо часов. Если джоба начнёт упираться в
    # лимит стабильно — это повод разобраться, а не молча поднять число.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Версия здесь обязана совпадать с той, что несёт запиненный в scripts/versions.json
          # FrankenPHP: пользователю уезжает интерпретатор из поставки, а не этот. До issue #536
          # тут стояло 8.4 при поставочном 8.5 — весь набор проверялся на минорную версию младше
          # той, на которой приложение реально работает, и класс «зелено в CI, ломается у
          # пользователя» был открыт по всей поверхности. Зазор не теоретический: на 8.5
          # doctrine:schema:validate падает с "SQLiteSchemaManager.php line 79: Warning: Undefined
          # array key 1", на 8.4 — нет.
          #
          # Значение сверяется со слепком автоматически: scripts/check-runtime-parity.js диффает
          # phpVersion поставочного бинаря (issue #536), поэтому расхождение после бампа
          # scripts/versions.json видно в Runtime parity, а не только глазами при чтении этого
          # файла. Тот же пин продублирован в build.yml, runtime-parity.yml и i18n-coverage.yml —
          # менять их вместе.
          php-version: '8.5'
          tools: composer
          coverage: none
          # intl добавлен ЗАРАНЕЕ, до кода, который им пользуется: подписи в переключателе
          # языка переезжают с ключей перевода на ICU-эндонимы (issue #461, PR #464), а
          # .github/ правит только человек — автоматика сюда не ходит, поэтому джоба
          # готовится отдельным PR перед той правкой, а не вместе с ней.
          #
          # На ubuntu-latest setup-php включает intl по умолчанию, так что сегодня строка
          # ничего не меняет. Она нужна против будущего: если умолчание изменится, тесты,
          # пропускающие себя при отсутствии расширения, уйдут в skip при зелёном прогоне —
          # не упадут, а молча перестанут проверять боевой путь.
          extensions: apcu, gd, intl
          ini-values: apc.enable_cli=1

      - name: Configure Composer auth for private repos
        run: composer config --global github-oauth.github.com ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: app

      # Интеграционный тест AnimeSearchIndexerTest поднимает НАСТОЯЩИЙ процесс Meilisearch и
      # проверяет схему индекса, синонимы и typo-tolerance против живого протокола — всё
      # остальное вокруг поиска работает с моками и про протокол ничего не утверждает. Без
      # бинаря тест пропускает сам себя, поэтому до issue #592 он не выполнился ни разу.
      #
      # Версия берётся из scripts/versions.json — того же пина, по которому download-bins.js
      # кладёт бинарь в поставку. Проверять индексатор против другой версии Meilisearch
      # бессмысленно: индекс несовместим между версиями, и зелёный CI ничего не сказал бы про
      # то, что поедет пользователю.
      #
      # SHA-256 запинен ЗДЕСЬ, а не в scripts/versions.json, намеренно: содержимое versions.json
      # целиком входит в build fingerprint (native/supervisor/cache-invalidation.js), поэтому
      # CI-only значение в нём означало бы разовый вайп кэша у пользователя на ровном месте.
      # Цена решения — пин надо обновлять вручную вместе с versions.meilisearch; забыть не
      # выйдет, шаг падает с явным указанием, что править (это Linux-бинарь, у него свой хеш,
      # с windows-amd64 из versions.json он не совпадает).
      - name: Provision Meilisearch for the indexer integration test
        env:
          MEILISEARCH_LINUX_SHA256: d6900108e66384b0b842f2596f71f65fa64594f4af760c42530eded82b996b0a
        run: |
          set -euo pipefail
          version="$(jq -er '.meilisearch' scripts/versions.json)"
          binary="$RUNNER_TEMP/meilisearch"
          curl -fsSL --retry 3 --retry-all-errors -o "$binary" \
            "https://github.com/meilisearch/meilisearch/releases/download/v${version}/meilisearch-linux-amd64"
          if ! echo "${MEILISEARCH_LINUX_SHA256}  ${binary}" | sha256sum --check --status -; then
            echo "::error::SHA-256 бинаря Meilisearch v${version} не совпал с пином MEILISEARCH_LINUX_SHA256 в .github/workflows/ci.yml. После бампа versions.meilisearch обнови пин там же (hash от meilisearch-linux-amd64, не от windows-amd64)."
            exit 1
          fi
          chmod +x "$binary"
          echo "MEILISEARCH_TEST_BINARY=$binary" >> "$GITHUB_ENV"

      # Полный прогон покрывает и консистентность переводов (бывшая отдельная job
      # translations-consistency гоняла подмножество этого же набора — удалена).
      #
      # `!cancelled()` добавлен вместе с шагом Meilisearch выше: провалившаяся выкачка бинаря
      # обязана валить джобу, но не обязана прятать результаты всего остального набора —
      # иначе одна сетевая ошибка отнимает у PR всю обратную связь по тестам.
      - name: Run PHPUnit
        if: ${{ !cancelled() }}
        run: vendor/bin/phpunit
        working-directory: app

      # Гейт против бесшумного возврата в skip. Зелёный основной прогон выше сам по себе не
      # доказывает, что тест отработал: при любой поломке окружения он снова начнёт пропускать
      # себя, и набор останется зелёным — ровно тот режим, в котором тест простоял всё время до
      # issue #592. Повторный прогон одного класса с --fail-on-skipped превращает пропуск в
      # падение; стоит меньше секунды — Meilisearch поднимается и гасится внутри теста.
      #
      # --fail-on-empty-test-suite закрывает второй способ обнулить гейт: переименование или
      # переезд класса делает --filter пустым, и «прогнали ноль тестов» — тоже успех. На
      # PHPUnit 12 это уже поведение по умолчанию (12.5.30 в composer.lock), но флаг задан явно:
      # composer.json допускает и ^11, где умолчание обратное, а весь смысл шага в том, что он
      # не имеет права молча превратиться в no-op из-за настройки по умолчанию.
      - name: Ensure the Meilisearch integration test really ran
        if: ${{ !cancelled() }}
        run: vendor/bin/phpunit --filter AnimeSearchIndexerTest --fail-on-skipped --fail-on-empty-test-suite
        working-directory: app

      - name: Run PHPStan
        if: ${{ !cancelled() }}
        run: composer phpstan
        working-directory: app

      - name: Check code style
        if: ${{ !cancelled() }}
        run: composer cs-check
        working-directory: app

  # Один job на весь JS-тулинг: npm ci один раз, затем lint + jest (та же логика
  # экономии, что и у PHP-джобы выше).
  js:
    name: JS
    runs-on: ubuntu-latest
    # Тот же потолок, что и у PHP-джобы, и по той же причине. Прогон идёт полминуты,
    # запас здесь ещё больше; значение держим одинаковым с соседней джобой намеренно —
    # это граница «что-то зависло», а не бюджет на выполнение.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Сборка фронтенда как проверка: до issue #735 клиентский JS раздавался как есть и
      # собирать было нечего, теперь `npm run assets` — обязательный шаг перед запуском
      # приложения (`npm start` зовёт его сам), и сломать его можно, не уронив ни один тест.
      # Jest трогает функции сборки с временными каталогами, а эта строка проверяет саму
      # команду и реальные пути вывода. Стоит секунды.
      - name: Build frontend assets
        run: npm run assets

      - name: Run ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Run Jest
        if: ${{ !cancelled() }}
        run: npm test
