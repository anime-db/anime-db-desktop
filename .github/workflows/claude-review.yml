name: Claude Code Review

on:
  # Без synchronize: ревью не перезапускается на каждый коммит (в т.ч. автоправки
  # openronin) — экономит минуты Actions. Триггерится на открытие PR, перевод из
  # черновика в готовый и переоткрытие. Для повторного ревью — reopen/ready.
  pull_request:
    types: [opened, ready_for_review, reopened]

# Один PR — одно ревью: при быстром ready→draft→ready отменяем предыдущий прогон,
# экономя минуты Actions и стоимость Claude-ревью. Все события здесь — только PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    # Черновики не ревьюим: openronin открывает PR черновиком (draft_pr: true), и без
    # этого гейта ревью прогонялось бы на недописанном коде на opened. Так ревью идёт
    # один раз — когда PR готов (ready_for_review) или открыт сразу не черновиком.
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Ты — Senior QA / Security Engineer.

            Отревьюй этот pull request. Отвечай по-русски.

            Ищи в первую очередь реальные проблемы:
            - Корректность: делает ли изменение то, что заявлено; логические ошибки,
              off-by-one, разыменование null, несоответствие типов.
            - Безопасность: инъекции, утечка секретов, невалидированный ввод на границах.
            - Регрессии: поломка существующего поведения.

            Специфика этого репозитория (anime-db-desktop):
            - Проект следует DDD — новые сущности и распределение полей/методов должны
              соответствовать rich domain model, а не анемичным структурам поверх сервисов.
            - ЗАПРЕЩЁН Yoda-style (`null === $x`): только обычный порядок (`$x === null`).
              Фиксер это НЕ исправляет автоматически, а openronin по умолчанию часто
              пишет именно в Yoda — проверяй внимательно.
            - Лицензионная GPLv3-шапка обязана быть в КАЖДОМ исходном файле (PHP, JS, TS, Bash).
            - Весь текст в Twig-шаблонах — только через `{% trans %}` / `trans()`,
              захардкоженный текст недопустим.

            Не флагай: стилевые придирки, которые ловит линтер проекта; гипотетические
            будущие проблемы, не относящиеся к этому PR.

            Публикуй замечания inline-комментариями к соответствующим строкам.
            Если существенных проблем нет — коротко подтверди это одним комментарием.
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
