name: Build Windows installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Сериализуем сборку одного тега (повторный пуш тега / ручной dispatch), но НЕ
# отменяем: релизную сборку по тегу нужно доводить до конца.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # Здесь потолок важнее, чем в CI: джоба идёт на windows-latest, где минуты
    # тарифицируются с множителем ×2, и качает ~230 МБ бинарей с GitHub Releases. У
    # скачивания в scripts/download-bins.js до issue #466 не было таймаута на сокет:
    # принятое, но замолчавшее соединение висело бы до умолчания GitHub в 360 минут,
    # то есть 720 билл-минут — больше трети месячного бюджета за одно зависание.
    # Успешная сборка укладывается в 3–4 минуты, так что 30 — примерно восьмикратный
    # запас с учётом промахов кеша и медленного раннера.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Download binaries
        run: npm run download-bins

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          # Расширения, которые app/composer.json объявляет в require. На windows-latest
          # setup-php не включает zip по умолчанию, из-за чего `composer install` падал на
          # проверке платформы ещё до сборки инсталлера. Этот PHP используется только для
          # composer — приложение работает на PHP, встроенном в FrankenPHP.
          #
          # intl здесь ПОКА ШИРЕ require: ext-intl объявляется в app/composer.json отдельно
          # (issue #461, PR #464), а эта джоба готовится заранее — .github/ правит только
          # человек. Порядок именно такой, потому что config.platform в composer.json не
          # задан: composer сверяет платформу с реальным PHP этой машины, и объявление
          # ext-intl раньше этой строки уронило бы сборку на первом же релизном теге.
          extensions: zip, ctype, iconv, intl

      - name: Build installer
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeDB-installer
          path: dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
