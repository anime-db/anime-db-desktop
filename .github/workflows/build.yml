name: Build Windows installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Сериализуем сборку одного тега (повторный пуш тега / ручной dispatch), но НЕ
# отменяем: релизную сборку по тегу нужно доводить до конца.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # Здесь потолок важнее, чем в CI: джоба идёт на windows-latest, где минуты
    # тарифицируются с множителем ×2, и качает ~230 МБ бинарей с GitHub Releases. У
    # скачивания в scripts/download-bins.js до issue #466 не было таймаута на сокет:
    # принятое, но замолчавшее соединение висело бы до умолчания GitHub в 360 минут,
    # то есть 720 билл-минут — больше трети месячного бюджета за одно зависание.
    # Успешная сборка укладывается в 3–4 минуты, так что 30 — примерно восьмикратный
    # запас с учётом промахов кеша и медленного раннера.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Download binaries
        run: npm run download-bins

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Совпадает с PHP, который несёт запиненный FrankenPHP — обоснование в ci.yml
          # (issue #536). Менять во всех четырёх workflow разом.
          php-version: '8.5'
          tools: composer
          # Ровно те расширения, которые app/composer.json объявляет в require, и список обязан
          # оставаться его надмножеством. `config.platform` в composer.json не задан, значит
          # composer сверяет платформу с реальным PHP этой машины, и недостающее расширение роняет
          # `composer install` внутри scripts/build.js ещё до сборки инсталлера. Этот PHP нужен
          # только composer'у: приложение работает на PHP, встроенном в FrankenPHP.
          #
          # Перечисляем всё явно, а не полагаемся на умолчания раннера, — по той же причине, что и
          # в runtime-parity.yml: умолчания setup-php могут измениться, и тогда сборка сломается на
          # ровном месте.
          #
          # Список уже разъезжался молча: коммит fa14290 (2026-08-23) добавил в require
          # ext-pdo_sqlite и ext-openssl, здесь их не появилось, и релизная сборка была сломана с
          # того дня. Джоба идёт только по тегу, тегов с тех пор не было, и увидели это лишь при
          # ручном прогоне 2026-08-28 (issue #535). Чтобы третьего раза не было, расхождение теперь
          # ловится tests/scripts/build-workflow-extensions.test.js в обычной JS-джобе на каждом PR.
          extensions: zip, ctype, iconv, gd, intl, mbstring, openssl, pdo_sqlite

      - name: Build installer
        run: npm run build

      # Гейт релиза (issue #535). Единственное место во всём пайплайне, где приложение
      # действительно запускается: ci.yml гоняет логику, runtime-parity.yml — интерпретатор и его
      # расширения, но ни одна джоба до этой не поднимала ни FrankenPHP как сервер, ни Electron.
      # Цена этого пробела уже измерена: app/Caddyfile пролежал в репозитории со дня первого
      # коммита в состоянии, в котором Caddy его не загружает, а Doctrine — без единого
      # замапленного пространства сущностей (issues #532, #533). Ни одну из двух поломок не поймали
      # ни полторы тысячи PHP-тестов, ни пять сотен JS, ни PHPStan, ни cs-check, ни Windows-джоба.
      #
      # Шаг стоит ПОСЛЕ сборки и ДО публикации: проверяется дерево dist/win-unpacked, то есть тот
      # самый состав, который упаковывается в инсталлер (заодно это единственная проверка того, что
      # globs в build.files ничего не потеряли), а красный гейт означает отсутствие релиза, а не
      # выпущенный и сломанный.
      #
      # Скрипт чёрно-ящичный: ничего из native/ не требует, env руками не собирает, порты не
      # выбирает — их выбирает сам супервизор, а скрипт спрашивает у ОС, что слушает процесс
      # FrankenPHP. Подробности — докблок scripts/release-smoke.js.
      - name: Release gate — start the built app and probe it
        run: npm run release-smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeDB-installer
          path: dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
