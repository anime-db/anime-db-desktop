name: Build Windows installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Сериализуем сборку одного тега (повторный пуш тега / ручной dispatch), но НЕ
# отменяем: релизную сборку по тегу нужно доводить до конца.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # Здесь потолок важнее, чем в CI: джоба идёт на windows-latest, где минуты
    # тарифицируются с множителем ×2, и качает ~230 МБ бинарей с GitHub Releases. У
    # скачивания в scripts/download-bins.js до issue #466 не было таймаута на сокет:
    # принятое, но замолчавшее соединение висело бы до умолчания GitHub в 360 минут,
    # то есть 720 билл-минут — больше трети месячного бюджета за одно зависание.
    # Успешная сборка укладывается в 3–4 минуты, так что 30 — примерно восьмикратный
    # запас с учётом промахов кеша и медленного раннера.
    timeout-minutes: 30
    # Сборка ничего не публикует: релиз и зеркало — в job publish (issue #1132). Здесь
    # исполняется всё дерево npm/composer-зависимостей и само собранное приложение, поэтому
    # токен только на чтение, а секретов подписи и зеркала в этом job нет.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          # Не оставляем токен в .git/config, где его прочитал бы любой код из npm ci /
          # composer install и само собранное приложение на release gate; git с токеном
          # джобе не нужен.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Download binaries
        run: npm run download-bins

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Совпадает с PHP, который несёт запиненный FrankenPHP — обоснование в ci.yml
          # (issue #536). Менять во всех workflow с этим пином разом — список в ci.yml.
          php-version: '8.5'
          tools: composer
          # Ровно те расширения, которые app/composer.json объявляет в require, и список обязан
          # оставаться его надмножеством. `config.platform` в composer.json не задан, значит
          # composer сверяет платформу с реальным PHP этой машины, и недостающее расширение роняет
          # `composer install` внутри scripts/build.js ещё до сборки инсталлера. Этот PHP нужен
          # только composer'у: приложение работает на PHP, встроенном в FrankenPHP.
          #
          # Перечисляем всё явно, а не полагаемся на умолчания раннера, — по той же причине, что и
          # в runtime-parity.yml: умолчания setup-php могут измениться, и тогда сборка сломается на
          # ровном месте.
          #
          # Список уже разъезжался молча: коммит fa14290 (2026-08-23) добавил в require
          # ext-pdo_sqlite и ext-openssl, здесь их не появилось, и релизная сборка была сломана с
          # того дня. Джоба идёт только по тегу, тегов с тех пор не было, и увидели это лишь при
          # ручном прогоне 2026-08-28 (issue #535). Чтобы третьего раза не было, расхождение теперь
          # ловится tests/scripts/build-workflow-extensions.test.js в обычной JS-джобе на каждом PR.
          extensions: zip, ctype, iconv, gd, intl, mbstring, openssl, pdo_sqlite, sodium, curl

      - name: Build installer
        run: npm run build

      # Гейт релиза (issue #535). Единственное место во всём пайплайне, где приложение
      # действительно запускается: ci.yml гоняет логику, runtime-parity.yml — интерпретатор и его
      # расширения, но ни одна джоба до этой не поднимала ни FrankenPHP как сервер, ни Electron.
      # Цена этого пробела уже измерена: app/Caddyfile пролежал в репозитории со дня первого
      # коммита в состоянии, в котором Caddy его не загружает, а Doctrine — без единого
      # замапленного пространства сущностей (issues #532, #533). Ни одну из двух поломок не поймали
      # ни полторы тысячи PHP-тестов, ни пять сотен JS, ни PHPStan, ни cs-check, ни Windows-джоба.
      #
      # Шаг стоит ПОСЛЕ сборки и ДО публикации: проверяется дерево dist/win-unpacked, то есть тот
      # самый состав, который упаковывается в инсталлер (заодно это единственная проверка того, что
      # globs в build.files ничего не потеряли), а красный гейт означает отсутствие релиза, а не
      # выпущенный и сломанный.
      #
      # Скрипт чёрно-ящичный: ничего из native/ не требует, env руками не собирает, порты не
      # выбирает — их выбирает сам супервизор, а скрипт спрашивает у ОС, что слушает процесс
      # FrankenPHP. Подробности — докблок scripts/release-smoke.js.
      - name: Release gate — start the built app and probe it
        run: npm run release-smoke

      # Гейт того, что нужно автообновлению от собранного приложения (issue #1092): полное
      # замыкание production-зависимостей внутри dist/win-unpacked/resources/app (а не только
      # каталог electron-updater — npm кладёт его зависимости рядом, и пропажа любой = тот же
      # MODULE_NOT_FOUND у пользователя; release-smoke этого не ловит, потому что на раннере Node
      # находит модули выше по дереву, в node_modules репозитория), latest.yml, указывающий на
      # существующий инсталлятор с blockmap, и признак releaseBuild упакованного package.json
      # (issue #1110): на теговой сборке true и version = тег без «v», иначе false — потерянный
      # признак выпустил бы релиз с выключенным апдейтером. Стоит до публикации и идёт и на ручной сборке:
      # красный шаг означает отсутствие релиза, а не релиз, из которого нельзя обновиться.
      # Подробности — докблок scripts/check-packaged-app.js.
      - name: Check the packaged app for the auto-updater
        run: node scripts/check-packaged-app.js

      # Гейт подписи обновлений под рантаймом приложения (issue #1132). node:crypto в Electron
      # собран на BoringSSL, а не на OpenSSL Node раннера, поэтому поддержку Ed25519 проверяем
      # там, где клиент будет её использовать: модуль native/updater/signature.js из
      # dist/win-unpacked и update-keys.json рядом с ним должны принять тестовый вектор
      # резервного ключа вторым ключом и отвергнуть первым. scripts/ в пакет не входит, поэтому
      # скрипт запускается из репозитория. Подробности — докблок scripts/check-update-verifier.js.
      - name: Check the update signature verifier under Electron
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: dist/win-unpacked/AnimeDB.exe scripts/check-update-verifier.js

      # Всё, что нужно job publish: инсталлятор, blockmap для дифференциальной загрузки и
      # latest.yml, который publish подпишет.
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: AnimeDB-installer
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  # Публикация релиза: подпись latest.yml, GitHub-релиз и зеркало mr01 (issue #1132).
  #
  # Отдельный job на ubuntu без npm ci / composer install: секрет подписи UPDATE_SIGNING_KEY и
  # креды зеркала MIRROR_CREDS не живут рядом со всем деревом npm-зависимостей и сборочными
  # скриптами. Скрипты публикации написаны без node_modules (Node 22 + curl).
  #
  # Только по тегу v*: ручной запуск с ветки собирает инсталлятор, но не публикует и не получает
  # секретов. Секреты — в Environment release, чья deployment policy пускает только теги v*, а
  # создавать теги v* может только admin (ruleset release-tags).
  #
  # Правило: опубликованный тег НЕ перевешивается. Перевес перезаписывает ассеты той же версии
  # у уже опубликованного релиза — копии, успевшие обновиться, исправление не получат, а у
  # качающих в этот момент не сойдётся sha512. Исправление — новым patch-тегом. Полный
  # перезапуск пересобирает инсталлятор с другим sha512 — его останавливает гард перевыпуска;
  # перезапуск упавшего publish с тем же артефактом проходит (подпись Ed25519 детерминирована).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # Умолчание GITHUB_TOKEN в этом репозитории — только чтение; без contents: write шаг
    # релиза падает с «Resource not accessible by integration».
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Node 22 — версия, под которую написаны и протестированы скрипты публикации (ci.yml);
      # на раннере предустановлен другой. Без cache: npm — зависимости здесь не ставятся.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: AnimeDB-installer
          path: dist

      # Проверка — по закоммиченному native/updater/update-keys.json, тем же ключам, что зашиты
      # в клиент, а не по ключу из секрета: неверный pubkey в клиенте роняет релиз здесь, а не
      # молча ломает канал обновлений у установленных копий.
      - name: Sign latest.yml
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          node scripts/sign-update.js dist/latest.yml
          node scripts/verify-update-signature.js dist/latest.yml

      - name: Refuse to republish a tag with different bytes
        run: node scripts/check-release-republish.js "$GITHUB_REF_NAME" dist/latest.yml

      # Тело релиза со ссылкой на Code signing policy (issue #1157: SignPath Foundation требует
      # её на странице релизов) задаётся только при создании релиза. softprops у существующего
      # релиза с body перезаписывает тело целиком, а с append_body дописывает строку повторно —
      # перезапуск publish стёр бы правки ментейнера или задублировал строку. Поэтому сначала
      # узнаём, есть ли релиз, — тем же способом, что и softprops: по списку релизов, куда входят
      # и черновики. releases/tags/{tag} черновик не отдаёт (404), и заранее подготовленные в
      # draft release notes были бы перезаписаны. Ошибка gh api роняет шаг (bash -e), а не
      # принимается за «релиза нет» — иначе сбой API на перезапуске перезаписал бы тело.
      - name: Check whether the release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -n "$ids" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      # Релиз — основной канал автообновления: клиенты берут latest.yml и latest.yml.sig
      # последнего релиза, проверяют подпись и качают инсталлятор из релиза его тега.
      #
      # fail_on_unmatched_files: по умолчанию softprops на ненайденный glob пишет warning и всё
      # равно публикует релиз — без latest.yml и подписи такой релиз клиенты не примут.
      #
      # prerelease: false задан явно: клиенты читают releases/latest, а pre-release туда не
      # попадает; флаг у существующего релиза softprops сохраняет как есть.
      #
      # body пуст у существующего релиза: тогда softprops оставляет его тело как есть.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          body: "${{ steps.release.outputs.exists == 'false' && format('Code signing policy: {0}/{1}#code-signing-policy', github.server_url, github.repository) || '' }}"
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/latest.yml.sig

      # Зеркало — второй источник на случай недоступного GitHub. Сбой заливки или сверки после
      # ретраев скрипт сам превращает в ::warning и выходит с 0: GitHub остаётся авторитетным, а
      # отставшее зеркало клиенту не вредит (он берёт наибольшую версию из прошедших проверку
      # подписи). Поэтому без continue-on-error: ненулевой код — только ошибка входа (нет файлов,
      # невалидный MIRROR_CREDS), и она должна быть видна. Сертификат FTPS проверяется всегда.
      - name: Publish to the mirror
        env:
          MIRROR_CREDS: ${{ secrets.MIRROR_CREDS }}
        run: node scripts/publish-update-mirror.js dist
