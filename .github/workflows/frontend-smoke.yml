name: Frontend smoke

# Единственный прогон в проекте, который поднимает приложение целиком и открывает его
# страницы: `npm run shots` стартует встроенный PHP-сервер, запускает Electron под Xvfb и
# снимает каждую страницу в двух темах. Всё остальное в CI проверяет исходники — jest грузит
# модули напрямую, PHPUnit рендерит шаблоны, и ни то ни другое не видит собранный бандл
# (issue #736).
#
# Отдельный workflow, а не job внутри ci.yml, ради минут: фильтр `paths` ниже не запускает
# прогон вовсе, если PR не трогает фронтенд, тогда как job-фильтр внутри ci.yml всё равно
# поднял бы раннер ради решения «пропустить» — а GitHub тарифицирует каждый job с округлением
# вверх до минуты. Правил ветки в репозитории нет (план не поддерживает branch protection),
# поэтому workflow, который на части PR не стартует, ничего не блокирует.
on:
  pull_request:
    paths:
      # Клиентский JS и стили — то, ради чего гейт и заводился.
      - 'app/assets/**'
      # Шаблоны: подключение бандла, атрибуты data-control, разметка, по которой ждёт capture.js.
      - 'app/templates/**'
      # Сборщик ассетов и сам инструмент прогона.
      - 'scripts/build-assets.js'
      - 'scripts/shots/**'
      # Бампы htmx/bootstrap/esbuild приезжают сюда и ломают страницу так же, как свой код.
      - 'package.json'
      - 'package-lock.json'
      # run.js переиспользует два Electron-независимых модуля супервизора — поиск свободного
      # порта и ожидание готовности бэкенда. Поломка там роняет сам прогон, а не страницу,
      # и без этих путей такой PR ушёл бы вообще без живой проверки.
      - 'native/supervisor/port.js'
      - 'native/supervisor/healthcheck.js'
      # Серверная часть: контроллеры, маршруты, конфиг, переводы и миграции ломают страницу
      # ответом 4xx/5xx, и с issue #746 прогон такой ответ отличает от здорового. До неё эти
      # пути в фильтре были бы платой за проверку, которая структурно не могла упасть.
      # Миграции здесь не ради страницы, а ради самого прогона: run.js накатывает их перед
      # стартом и падает, если накатить не получилось.
      - 'app/src/**'
      - 'app/config/**'
      - 'app/translations/**'
      - 'app/migrations/**'
      - 'app/public/index.php'
      # Та же логика, по которой в фильтре уже есть package.json/package-lock.json: бамп
      # Symfony/Twig/Doctrine ломает страницу так же, как свой код, а .env и bin/console
      # участвуют ещё и в накате миграций, который run.js делает перед стартом.
      - 'app/composer.json'
      - 'app/composer.lock'
      - 'app/.env'
      - 'app/bin/console'
      # Правка самого гейта обязана проверяться этим же гейтом.
      - '.github/workflows/frontend-smoke.yml'

# Чего в фильтре нет намеренно: `app/tests/**` и `tests/**` — падение теста ловит свой
# прогон, живое приложение от правки теста не меняется.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Shots
    runs-on: ubuntu-latest
    # Больше, чем 15 у джоб в ci.yml: здесь к composer install и npm ci добавляются установка
    # системных библиотек Electron и сам прогон под Xvfb (локально — около минуты на 24 снимка).
    # Это граница «что-то зависло», а не бюджет на выполнение.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Тот же пин, что в ci.yml/build.yml/runtime-parity.yml/i18n-coverage.yml/
          # plugin-contracts-check.yml/plugin-contracts-drift.yml, и менять его
          # надо вместе с ними: версия обязана совпадать с той, что несёт запиненный в
          # scripts/versions.json FrankenPHP (issue #536).
          php-version: '8.5'
          tools: composer
          coverage: none
          extensions: apcu, gd, intl
          ini-values: apc.enable_cli=1

      # Токен ставится перед установкой и снимается сразу после неё: дальше джоба исполняет код, и
      # секрету на диске там делать нечего (issue #971). Через `env` шага установки его передать
      # нельзя — почему, см. .claude-docs/gotchas.md §«COMPOSER_AUTH на шаге ramsey/composer-install».
      - name: Configure Composer auth
        run: composer config --global github-oauth.github.com ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: app

      - name: Drop the Composer token from disk
        run: composer config --global --unset github-oauth.github.com

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # Electron под Xvfb тянет набор системных библиотек, которых нет в образе раннера.
      # Список — тот же, что scripts/shots/run.js печатает в подсказке при ldd-проверке;
      # имена с суффиксом t64 — это Ubuntu 24.04, на которой сейчас ubuntu-latest.
      - name: Install Electron runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libnss3 \
            libasound2t64 libcups2t64 libdrm2 libxkbcommon0 libpango-1.0-0 libcairo2 \
            libatspi2.0-0t64 libxdamage1 libxrandr2 libxcomposite1 libxfixes3 libxshmfence1

      - name: Build frontend assets
        run: npm run assets

      # База данных пустая: миграции накатывает сам run.js, демо-данные не сеются. Проверено —
      # прогон на пустом каталоге зелёный: снимок карточки тайтла пропускается (нечего
      # открывать), а сам каталог доходит до состояния «список пуст», которое capture.js и ждёт.
      - name: Run shots
        run: npm run shots
