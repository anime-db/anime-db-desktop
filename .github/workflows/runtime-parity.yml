name: Runtime parity

# Группа `runtime-parity` (issue #472) помечает тесты, исход которых зависит от того, какой
# интерпретатор и какая ОС их исполняют: спавн подпроцесса через \PHP_BINARY, реальные
# межпроцессные блокировки файлов, данные ICU. Основной набор гоняется на Linux с системным PHP
# (ci.yml) — здесь та же выборка прогоняется на Windows, то есть на той ОС, под которую
# приложение собирается.
#
# Выборка гоняется дважды, и это две разные проверки. Сначала под системным PHP из setup-php —
# меняется одна переменная, операционная система. Затем под самим frankenphp.exe — меняется
# вторая, интерпретатор. Второе стало возможно после #484: php.ini для боевого бинаря теперь
# рендерится без Electron, иначе он стартовал бы без extension_dir и без расширений.
on:
  pull_request:
    paths:
      # Тесты, помеченные группой. Список явный, а не маской: маска на app/tests/Unit/Service/**
      # цепляла бы почти каждый PR и удваивала расход Windows-минут. Плата за это —
      # обязанность дописать сюда файл, если группа пополнится. Промах не даёт ложно-зелёного:
      # выборка всё равно прогоняется на Linux в основном наборе, просто без Windows-сигнала.
      - 'app/tests/Unit/Service/AppConfigStoreConcurrencyTest.php'
      - 'app/tests/Unit/Service/LocaleEndonymResolverTest.php'
      - 'app/tests/Unit/Service/Plugin/InstalledPluginsRegistryConcurrencyTest.php'
      - 'app/tests/Unit/Service/Plugin/PluginDirectoryRemoverTest.php'
      - 'app/tests/Unit/Service/Plugin/PluginsConfigStoreConcurrencyTest.php'
      - 'app/tests/Unit/Service/Plugin/ZipPluginInstallerConcurrencyTest.php'
      - 'app/tests/Unit/Service/Plugin/ZipPluginInstallerTest.php'
      # Код, который эти тесты покрывают.
      - 'app/src/Service/Plugin/**'
      - 'app/src/Service/AppConfigStore.php'
      - 'app/src/Service/LocaleEndonymResolver.php'
      # Состав группы, платформенные требования и сам этот файл.
      - 'app/phpunit.xml.dist'
      - 'app/composer.json'
      - 'app/composer.lock'
      # Всё, от чего зависит запуск боевого интерпретатора на шаге 2.
      - 'scripts/download-bins.js'
      - 'scripts/versions.json'
      - 'scripts/generate-php-ini.js'
      - 'native/php-ini.js'
      - 'native/supervisor/php-cli-command.js'
      - 'bin/php/php.ini.template'
      # Сверка со слепком: и сам скрипт, и записанные значения.
      - 'scripts/check-runtime-parity.js'
      - 'scripts/frankenphp-runtime.json'
      - '.github/workflows/runtime-parity.yml'
  workflow_dispatch:

# Своя группа, а не общая с ci.yml: отменять прогоны CI при старте этой джобы было бы неверно.
# cancel-in-progress включён, чтобы пачки автоправок не множили Windows-минуты — они
# тарифицируются с множителем ×2.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Runtime parity (Windows)
    runs-on: windows-latest
    # Выборка идёт секунды, всё остальное — минуты: composer install, npm ci, скачивание 56 МБ
    # архива FrankenPHP и два прогона тестов. 20 против 15 у джоб ci.yml именно поэтому; это
    # по-прежнему граница «что-то зависло», а не бюджет на выполнение.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
          # Расширения перечислены явно, а не оставлены на умолчание раннера: после issue #467
          # composer проверяет платформенные требования в рантайме, и недостающее расширение
          # уронит прогон на автозагрузчике, а не на понятном шаге.
          extensions: apcu, gd, intl, zip, openssl, pdo_sqlite
          ini-values: apc.enable_cli=1

      - name: Configure Composer auth for private repos
        run: composer config --global github-oauth.github.com ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: app

      # Только группа. Остальные 1232 теста — чистая логика, которой безразлично, где она
      # исполняется, и гонять их здесь значило бы платить вдвое за нулевую информацию.
      - name: Run runtime-parity group
        run: vendor/bin/phpunit --group runtime-parity
        working-directory: app

      # --- Шаг 2: та же выборка, но под боевым интерпретатором ---------------------------
      #
      # Выше менялась одна переменная — ОС. Ниже меняется вторая: вместо системного PHP из
      # setup-php ту же группу исполняет frankenphp.exe, тот самый бинарь, который уезжает
      # пользователю. До этого шага боевой интерпретатор не запускался нигде: и упаковка
      # (#477), и линтинг плагинов (#478) проверялись статически либо на Linux-сборке.
      #
      # Шаги идут через `if: ${{ !cancelled() }}`, чтобы падение прогона на системном PHP не
      # скрыло результат прогона на боевом, и наоборот — как в ci.yml.

      - name: Setup Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        if: ${{ !cancelled() }}
        run: npm ci

      # Качаем только FrankenPHP, а не все три бинаря: Meilisearch и qbittorrent-nox добавили бы
      # ~230 МБ и собственные режимы отказа (проверка подписи) к джобе, которая про них ничего не
      # проверяет. `npm run download-bins` тянет всё, поэтому дёргаем экспортируемую функцию
      # напрямую — она же делает сверку SHA-256 из #466 и извлекает весь курируемый набор DLL.
      - name: Download the pinned FrankenPHP build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node -e '
            const bins = require("./scripts/download-bins");
            const frankenphp = bins.BINS.find((bin) => bin.name === "frankenphp");
            bins.downloadBin(frankenphp).catch((error) => {
                console.error(error);
                process.exit(1);
            });
          '

      # Без php.ini боевой бинарь стартует без extension_dir, а расширения в Windows-сборке —
      # подгружаемые DLL (#477), то есть intl/zip/pdo_sqlite/openssl не загрузятся и прогон
      # упадёт не по существу. Генератор из #484 отдаёт каталог с готовым ini на stdout — он и
      # уходит в PHPRC (это путь к папке, не к файлу).
      - name: Generate php.ini for the packaged interpreter
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "PHPRC=$(node scripts/generate-php-ini.js --timezone UTC)" >> "$GITHUB_ENV"

      # Явная проверка перед тестами: если расширение не подхватилось, пусть это скажет одна
      # понятная строка, а не двадцать провалившихся тестов с разными симптомами.
      - name: Verify the packaged interpreter loads its extensions
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: app
        run: |
          ../bin/frankenphp/frankenphp.exe php-cli -r '
            foreach (["intl", "zip", "pdo_sqlite", "openssl", "mbstring", "gd"] as $extension) {
                if (!extension_loaded($extension)) {
                    fwrite(STDERR, "missing extension: $extension\n");
                    exit(1);
                }
                echo "$extension ok\n";
            }
          '

      # Критерий, открытый с 2026-07-06. Решение «все картинки, попадающие в AppData, ресайзятся
      # через GD2, WebP — целевой формат» (обложки и кадры аниме) закрывалось с явной оговоркой:
      # проверить gd_info()['WebP Support'] на реально собранном бинаре, ПРЕЖДЕ чем код станет на
      # это полагаться. Проверить было нечем — бинаря в репозитории нет, Windows-раннера тогда не
      # было. Теперь есть и то и другое.
      #
      # Отдельным шагом, а не строкой в проверке выше: там вопрос «загрузилось ли расширение»,
      # здесь — «умеет ли оно то, на что рассчитывает продуктовое решение». Разные вопросы, и при
      # падении должно быть видно, какой именно.
      - name: Verify GD can actually encode WebP
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: app
        run: |
          ../bin/frankenphp/frankenphp.exe php-cli -r '
            $info = gd_info();
            echo "GD ", $info["GD Version"] ?? "?", "\n";
            foreach (["WebP Support", "PNG Support", "JPEG Support"] as $capability) {
                printf("%-14s %s\n", $capability, !empty($info[$capability]) ? "yes" : "NO");
            }

            // Флага gd_info() недостаточно: он говорит, что сборка собиралась с libwebp, а не что
            // кодирование работает. Критерий 2026-07-06 допускал и пробный imagewebp() — берём его,
            // раз имя шага обещает именно кодирование. Проверяется и код возврата, и что на выходе
            // действительно WebP: контейнер RIFF с сигнатурой WEBP.
            $image = imagecreatetruecolor(8, 8);
            imagefilledrectangle($image, 0, 0, 7, 7, imagecolorallocate($image, 10, 20, 30));
            $file = tempnam(sys_get_temp_dir(), "webp").".webp";
            $encoded = imagewebp($image, $file);
            $bytes = is_file($file) ? file_get_contents($file) : "";
            @unlink($file);

            $riff = substr($bytes, 0, 4) === "RIFF" && substr($bytes, 8, 4) === "WEBP";
            printf("encode         %s (%d bytes, RIFF/WEBP header: %s)\n",
                $encoded ? "ok" : "FAILED", strlen($bytes), $riff ? "yes" : "NO");

            if (empty($info["WebP Support"]) || !$encoded || !$riff) {
                fwrite(STDERR, "GD in the shipped build cannot encode WebP — the target format decided on 2026-07-06 does not hold, see issue #496\n");
                exit(1);
            }
          '

      # Сверка с слепком рантайма (issue #471). Слепок снят на этой же джобе и лежит в
      # репозитории: 20 файлов курируемого набора с пофайловыми хешами, 36 расширений, ICU 77.1
      # с данными CLDR 47, эндонимы четырёх локалей, значимые ini. Расхождение любого из этих
      # фактов — например при бампе версии FrankenPHP в scripts/versions.json — роняет билд
      # здесь, а не всплывает у пользователя.
      #
      # Слепок обновляется человеком: `node scripts/check-runtime-parity.js --write` на Windows,
      # в том же PR, где меняется пин версии. Автоматически он не перезаписывается намеренно —
      # слепок, который сам себя чинит, не проверяет ничего.
      - name: Compare the packaged runtime against the recorded snapshot
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/check-runtime-parity.js

      # Точка входа — vendor/phpunit/phpunit/phpunit, а не vendor/bin/phpunit: у php-cli первым
      # аргументом обязан идти путь к PHP-скрипту (#478), а vendor/bin на Windows composer
      # раскладывает ещё и .bat-обёрткой. Аргументы после скрипта до PHPUnit доходят — script-режим
      # заполняет $argv штатно, в отличие от `-r` (см. .claude-docs/gotchas.md).
      - name: Run runtime-parity group under FrankenPHP
        if: ${{ !cancelled() }}
        run: ../bin/frankenphp/frankenphp.exe php-cli vendor/phpunit/phpunit/phpunit --group runtime-parity
        working-directory: app
